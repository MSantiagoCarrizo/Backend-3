components:
  schemas:
    SuccessResponse:
      type: object
      description: Estructura base de toda respuesta exitosa. Cada endpoint le suma su contenido en payload.
      properties:
        status:
          type: string
          example: success

    ErrorResponse:
      type: object
      description: Estructura de toda respuesta de error. code identifica el error y message lo describe.
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Usuario no encontrado
        code:
          type: string
          enum:
            - INTERNAL_SERVER_ERROR
            - ROUTE_NOT_FOUND
            - VALIDATION_ERROR
            - INVALID_ID
            - INVALID_JSON
            - EMAIL_ALREADY_EXISTS
            - DUPLICATE_KEY
            - USER_NOT_FOUND
            - STORE_NOT_FOUND
            - ORDER_NOT_FOUND
            - DELIVERY_NOT_FOUND
            - DRIVER_NOT_FOUND
            - ORDER_ITEMS_REQUIRED
            - INVALID_ORDER_STATUS
            - INVALID_DELIVERY_STATUS
            - INVALID_DRIVER_ROLE
            - INVALID_MOCK_AMOUNT
            - MOCK_AMOUNT_TOO_LARGE
            - MOCK_USERS_REQUIRED
            - NO_STORES_AVAILABLE
            - MOCK_DELIVERIES_REQUIRED
            - MOCK_GENERATION_ERROR
          example: USER_NOT_FOUND

    User:
      type: object
      properties:
        _id:
          type: string
          example: 665f4d0a8f9a1b001234abce
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Pérez
        email:
          type: string
          format: email
          example: ana@mail.com
        role:
          type: string
          enum: [admin, customer, store, driver]
          example: customer
        documents:
          type: array
          items:
            type: object
          example: []
        createdAt:
          type: string
          format: date-time
          example: "2026-11-05T13:51:12.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-11-05T13:51:12.000Z"

    Store:
      type: object
      description: Comercio. Aparece dentro de un pedido cuando se consulta con el comercio completo.
      properties:
        _id:
          type: string
          example: 665f4d0a8f9a1b001234abc1
        name:
          type: string
          example: Pizzería Roma
        address:
          type: string
          example: Calle Falsa 123
        owner:
          type: string
          description: ID del usuario dueño del comercio
          example: 665f4d0a8f9a1b001234abc4
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-11-05T13:51:12.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-11-05T13:51:12.000Z"

    OrderItem:
      type: object
      required:
        - name
        - quantity
        - price
      properties:
        name:
          type: string
          example: Paquete mediano
        quantity:
          type: number
          example: 2
        price:
          type: number
          example: 1500

    Order:
      type: object
      properties:
        _id:
          type: string
          example: 665f4d0a8f9a1b001234abcd
        customer:
          description: >
            ID del cliente. En GET /api/orders y GET /api/orders/{oid} viene el usuario
            completo (sin password).
          oneOf:
            - type: string
            - $ref: '#/components/schemas/User'
          example: 665f4d0a8f9a1b001234abce
        store:
          description: >
            ID del comercio. En GET /api/orders y GET /api/orders/{oid} viene el comercio
            completo.
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Store'
          example: 665f4d0a8f9a1b001234abc1
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        deliveryAddress:
          type: string
          example: Av. Siempre Viva 742
        total:
          type: number
          description: Suma de precio por cantidad de cada item. Lo calcula el servidor.
          example: 3000
        status:
          type: string
          enum: [created, assigned, picked_up, in_transit, delivered, cancelled]
          example: created
        priority:
          type: string
          enum: [low, normal, high]
          example: normal
        proof:
          type: object
          nullable: true
          description: Comprobante de entrega. Es null hasta que se carga.
        createdAt:
          type: string
          format: date-time
          example: "2026-11-05T13:51:12.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-11-05T13:51:12.000Z"

    Delivery:
      type: object
      properties:
        _id:
          type: string
          example: 665f4d0a8f9a1b001234abc2
        order:
          description: >
            ID del pedido. En GET /api/deliveries y GET /api/deliveries/{did} viene el
            pedido completo.
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Order'
          example: 665f4d0a8f9a1b001234abcd
        driver:
          description: >
            ID del repartidor. En GET /api/deliveries y GET /api/deliveries/{did} viene el
            usuario completo (sin password).
          oneOf:
            - type: string
            - $ref: '#/components/schemas/User'
          example: 665f4d0a8f9a1b001234abc3
        status:
          type: string
          enum: [assigned, in_transit, delivered, cancelled]
          example: assigned
        priority:
          type: string
          enum: [low, normal, high]
          example: normal
        notes:
          type: string
          nullable: true
          example: Tocar el timbre dos veces
        createdAt:
          type: string
          format: date-time
          example: "2026-11-05T13:51:12.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-11-05T13:51:12.000Z"

  responses:
    InvalidId:
      description: El ID enviado en la URL no tiene un formato válido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: ID inválido
            code: INVALID_ID

    InternalServerError:
      description: Error inesperado del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Error interno del servidor
            code: INTERNAL_SERVER_ERROR